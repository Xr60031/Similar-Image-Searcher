# path: omnisource/pyproject.toml
[project]
name = "omnisource"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "httpx==0.27.0",
    "pydantic==2.7.1",
    "selectolax==0.3.21",
    "playwright==1.44.0",
    "tenacity==8.3.0",
    "structlog==24.1.0",
    "typer==0.12.3",
    "click==8.1.7",
    "rich==13.7.1",
    "aiosqlite==0.20.0",
    "pillow==10.3.0",
    "imagehash==4.3.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"